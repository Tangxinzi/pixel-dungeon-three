<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172725" />
    <title>林野疾行 // 手绘奇境</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-column" aria-label="林野疾行跑酷游戏">
        <div class="game-header">
          <div>
            <p class="eyebrow">自然奇幻 / 路线 01</p>
            <h1>林野疾行 <span>//</span> 01</h1>
            <p class="subtitle">沿着风的方向，穿过会发光的森林。</p>
          </div>
          <div class="run-chip"><span class="run-dot"></span><span id="run-state">奔跑中</span></div>
        </div>

        <div id="game-wrap" class="game-wrap">
          <canvas id="game-canvas" aria-label="林野疾行游戏画布"></canvas>
          <div class="screen-vignette"></div>
          <div id="result-panel" class="result-panel hidden" role="status" aria-live="polite">
            <p class="result-kicker" id="result-kicker">旅程完成</p>
            <h2 id="result-title">抵达山谷</h2>
            <p id="result-copy">风把你带到了森林尽头。</p>
            <button id="restart-button" class="primary-button" type="button">再来一次 <span>↵</span></button>
          </div>
        </div>

        <div class="touch-controls" aria-label="触控操作">
          <button id="touch-jump" class="control-button jump" type="button" title="跳跃" aria-label="跳跃"><span>↟</span></button>
          <button id="touch-slide" class="control-button slide" type="button" title="滑铲" aria-label="滑铲"><span>⌁</span></button>
        </div>
      </section>

      <aside class="side-panel" aria-label="游戏信息">
        <div class="panel-block status-block">
          <div class="section-label"><span>旅人状态</span><span class="section-code">01A</span></div>
          <div class="health-row">
            <div class="health-icon">♥</div>
            <div class="health-track"><div id="health-fill" class="health-fill"></div></div>
            <strong id="health-value">3</strong>
          </div>
          <div class="stat-grid">
            <div><span>里程</span><strong id="distance-value">000m</strong></div>
            <div><span>星火</span><strong id="star-value">000</strong></div>
          </div>
          <div class="progress-track"><div id="distance-fill" class="distance-fill"></div></div>
        </div>

        <div class="panel-block objective-block">
          <div class="section-label"><span>旅途手记</span><span class="section-code">01</span></div>
          <div class="mission-line"><span class="mission-index">01</span><p>跑过林间小路</p><span id="mission-status" class="mission-status">进行中</span></div>
          <div class="mission-line"><span class="mission-index">02</span><p>收集萤火</p><span id="star-status" class="mission-status">0 / 8</span></div>
          <div class="mission-line"><span class="mission-index">03</span><p>抵达山谷</p><span id="exit-status" class="mission-status">0%</span></div>
        </div>

        <div class="panel-block mood-block">
          <div class="section-label"><span>今日天气</span><span class="section-code">晴</span></div>
          <p class="mood-copy">风很轻，云在山背后慢慢移动。前方有一条被阳光照亮的小路。</p>
          <div class="mood-line"><span class="mood-dot sun"></span><span>暖日</span><span class="mood-dot leaf"></span><span>微风</span><span class="mood-dot firefly"></span><span>星火</span></div>
        </div>

        <div class="panel-footer"><span>版本 2.0.0</span><span>THREE.JS / 林野模式</span></div>
      </aside>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
